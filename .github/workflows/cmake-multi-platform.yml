name: Build C++ CMake Project

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build_type: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev libasound2-dev

      - name: Configure CMake (Linux/Windows)
        if: runner.os != 'macOS'
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPRODUCTION_BUILD=ON
          -DGLFW_BUILD_EXAMPLES=OFF
          -DGLFW_BUILD_TESTS=OFF
          -DGLFW_BUILD_DOCS=OFF
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Configure CMake (macOS universal)
        if: runner.os == 'macOS'
        run: >
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DPRODUCTION_BUILD=ON
          -DGLFW_BUILD_EXAMPLES=OFF
          -DGLFW_BUILD_TESTS=OFF
          -DGLFW_BUILD_DOCS=OFF
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build Project
        run: cmake --build ${{ github.workspace }}/build --config ${{ matrix.build_type }} -j 2

      - name: Read executable name from CMake
        shell: bash
        run: |
          APP_NAME=$(grep -m1 '^CMAKE_PROJECT_NAME:STATIC=' build/CMakeCache.txt | cut -d= -f2-)
          test -n "$APP_NAME" || { echo "could not read project name"; exit 1; }
          echo "APP_NAME=$APP_NAME" >> "$GITHUB_ENV"

      - name: Stage package
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then cp "build/${{ matrix.build_type }}/${{ env.APP_NAME }}.exe" dist/; else cp "build/${{ env.APP_NAME }}" dist/; fi
          cp -r shaders resources dist/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.os }}-${{ matrix.build_type }}
          path: dist/
          if-no-files-found: error